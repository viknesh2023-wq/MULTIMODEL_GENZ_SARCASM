# Unified Annotation and Label Schema Configuration
version: "1.0.0"

definition:
  operational_definition: >
    Passive aggression is indirect communication that provides evidence of interpersonal hostility,
    resentment, blame or criticism, rather than merely expressing negative sentiment, sarcasm or disagreement.

primary_labels:
  - passive_aggressive
  - non_passive_aggressive
  - ambiguous

subtypes:
  - fake_politeness
  - indirect_criticism
  - backhanded_compliment
  - implied_blame
  - sarcastic_agreement
  - dismissiveness
  - other_or_unclear

contrast_categories:
  - direct_aggression
  - ordinary_negativity
  - genuine_sadness
  - constructive_disagreement
  - friendly_teasing
  - pure_sarcasm

image_availability_statuses:
  - AVAILABLE
  - MISSING
  - NOT_APPLICABLE
  - CORRUPT

annotation_statuses:
  - RAW
  - PROVISIONAL_AI
  - HUMAN_VERIFIED
  - SYNTHETIC_PILOT

synthetic_statuses:
  - REAL
  - SYNTHETIC_UNVERIFIED
  - SYNTHETIC_VERIFIED

split_statuses:
  - train
  - validation
  - test
  - unassigned

required_fields:
  - example_id
  - source_dataset
  - source_record_id
  - target_comment
  - annotation_status
  - synthetic_status
