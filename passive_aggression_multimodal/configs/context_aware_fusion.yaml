# Configuration for Context-Aware Multimodal Fusion (Phase 3 Task H)
version: "3.0.0"
artifact_dir: "artifacts/phase3/context_aware_fusion"

model:
  image_dim: 768
  text_dim: 768
  hidden_dim: 512
  num_classes: 3
  num_attention_heads: 4
  dropout: 0.1

training:
  epochs: 15
  learning_rate: 0.001
  weight_decay: 0.0001
  batch_size: 16
  early_stopping_patience: 4
  seed: 42
  device: "cpu"
