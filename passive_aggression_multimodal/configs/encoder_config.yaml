# Pretrained Multimodal Feature Extraction Configuration
version: "2.0.0"

device: "cpu"  # Auto-falls back to cpu when CUDA unavailable

vision_encoder:
  primary: "openai/clip-vit-base-patch32"
  alternative: "google/siglip-base-patch16-224"
  output_dim: 768
  input_resolution: [224, 224]
  normalization: "imagenet"
  batch_size: 16
  missing_modality_policy: "zero_vector_with_flag"

text_encoder:
  primary: "microsoft/deberta-v3-base"
  alternative: "FacebookAI/xlm-roberta-base"
  output_dim: 768
  max_seq_length: 128
  pooling: "mean"  # options: mean, cls
  batch_size: 16
  include_context_prefix: true

fusion:
  strategy: "projected_concatenation"
  fusion_dim: 512
  dropout: 0.2
  num_classes_primary: 3    # passive_aggressive, non_passive_aggressive, ambiguous
  num_classes_auxiliary: 3  # sarcastic, non_sarcastic, ambiguous
