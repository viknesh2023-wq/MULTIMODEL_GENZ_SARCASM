# Phase 3 Multimodal Feature Extraction Configuration
version: "3.0.0"
storage_dir: "data/features/phase3"
device: "cpu"

text_encoder:
  primary_checkpoint: "FacebookAI/xlm-roberta-base"
  alternative_checkpoint: "sentence-transformers/all-MiniLM-L6-v2"
  hidden_dim: 768
  max_length: 128
  pooling: "mean"
  batch_size: 16
  local_files_only: true

vision_encoder:
  primary_checkpoint: "openai/clip-vit-base-patch32"
  output_dim: 768
  batch_size: 16
  offline_fallback: true

feature_sets:
  synthetic_pilot: "data/synthetic/synthetic_pilot_350.jsonl"
  annotation_pilot: "data/processed/annotation_pilot_150.jsonl"
  grouped_train: "data/splits/grouped_train.jsonl"
  grouped_val: "data/splits/grouped_validation.jsonl"
  grouped_test: "data/splits/grouped_test.jsonl"
