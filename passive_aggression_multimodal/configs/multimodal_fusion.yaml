# Configuration for Gated Multimodal Fusion (Phase 3 Task G)
version: "3.0.0"
artifact_dir: "artifacts/phase3/multimodal_fusion"

model:
  image_dim: 768
  text_dim: 768
  hidden_dim: 512
  num_classes_primary: 3
  num_classes_auxiliary: 3
  dropout: 0.1
  fusion_type: "concat_gated"

training:
  epochs: 15
  learning_rate: 0.001
  weight_decay: 0.0001
  batch_size: 16
  early_stopping_patience: 4
  seed: 42
  device: "cpu"
