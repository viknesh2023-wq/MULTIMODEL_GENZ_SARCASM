# Synthetic Data Generation Configuration
version: "1.0.0"
target_count: 350
status_default: "SYNTHETIC_UNVERIFIED"
human_review_status_default: "AWAITING_REVIEW"

archetypes:
  - name: "fake_politeness"
    description: "Surface-level politeness or formal courtesy masking hostility, contempt, or undermining."
    target_proportion: 0.12
  - name: "indirect_criticism"
    description: "Veiled attacks, snide remarks, or rhetorical questioning designed to diminish without stating the critique overtly."
    target_proportion: 0.12
  - name: "backhanded_compliment"
    description: "A compliment paired with a subtle insult, patronizing qualifier, or belittling caveat."
    target_proportion: 0.12
  - name: "implied_blame"
    description: "Subtly holding someone responsible for a failure, delay, or flaw through loaded phrasing without an overt accusation."
    target_proportion: 0.10
  - name: "sarcastic_agreement"
    description: "Pretending to endorse or validate someone's assertion in a mocking, derisive manner."
    target_proportion: 0.10
  - name: "dismissiveness"
    description: "Curt, passive-aggressive brush-offs designed to invalidate the poster or other commenters ('must be nice', 'whatever you say')."
    target_proportion: 0.10
  - name: "direct_criticism_contrast"
    description: "Contrast class: Overt, direct hostility or criticism (non-PA)."
    target_proportion: 0.07
  - name: "ordinary_negativity_contrast"
    description: "Contrast class: Expressing sadness, grief, exhaustion, or frustration about life/events without interpersonal hostility."
    target_proportion: 0.07
  - name: "friendly_teasing_contrast"
    description: "Contrast class: Joking banter between friends with clear affectionate tone and context."
    target_proportion: 0.07
  - name: "constructive_disagreement_contrast"
    description: "Contrast class: Civil, objective counterarguments or corrections without spite or rancor."
    target_proportion: 0.07
  - name: "ambiguous_scenarios"
    description: "Genuinely under-specified cases where tone, relationship, or context cannot be determined."
    target_proportion: 0.07

multimodal_dependencies:
  - image_necessary: "Interpretation reverses or clarifies only when looking at the image incongruity."
  - image_irrelevant: "Text alone carries the indirect hostility; image is stock or decorative."
  - context_dependent: "Comment depends entirely on preceding dialogue thread."
