# Configuration for Pretrained Transformer Text Baseline (Phase 3 Task D)
version: "3.0.0"
artifact_dir: "artifacts/phase3/text_transformer"

model:
  pretrained_model_name: "FacebookAI/xlm-roberta-base"
  hidden_dim: 768
  num_classes: 3
  dropout: 0.1
  device: "cpu"

training:
  epochs: 15
  learning_rate: 0.001
  weight_decay: 0.0001
  batch_size: 16
  early_stopping_patience: 4
  seed: 42
