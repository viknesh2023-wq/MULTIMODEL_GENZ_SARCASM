# Master PyTorch Training Configuration for Phase 3 (Task I)
version: "3.0.0"
seed: 42
device: "cpu"

optimizer:
  type: "AdamW"
  learning_rate: 0.001
  weight_decay: 0.0001
  grad_clip_norm: 1.0

scheduler:
  type: "none"

early_stopping:
  metric: "val_macro_f1"
  mode: "max"
  patience: 4

data_loader:
  batch_size: 16
  shuffle_train: true
  drop_last: false

checkpointing:
  save_best_only: false
  max_to_keep: 3
